name: watchdogs

x-app: &app
  build: { context: ., dockerfile: Dockerfile }
  env_file: .env
  environment:
    DATABASE_URL: postgres://watchdogs:watchdogs@postgres:5432/watchdogs
    SMTP_HOST: ${SMTP_HOST_DOCKER:-mailpit}
  depends_on:
    postgres: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchdogs
      POSTGRES_PASSWORD: watchdogs
      POSTGRES_DB: watchdogs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdogs"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  web:
    <<: *app
    command: ["pnpm", "--filter", "@watchdogs/web", "start"]
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@watchdogs/worker", "start"]
    volumes: [browser-profile:/app/.browser-profile]

  caddy:
    profiles: [production]
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

volumes:
  pgdata:
  uploads:
  browser-profile:
  caddy-data:
